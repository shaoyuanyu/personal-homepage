# 会议 deadline 覆盖层（站内手动维护，优先级高于自动同步的 ccfddl 数据）
#
# 用途：
#   1. CCF 目录之外的会议（直接新增条目）
#   2. 修正 ccfddl 自动数据中的错误/过期信息
#
# 合并规则（按缩写 a 匹配，大小写不敏感）：
#   - 覆盖层条目的「缩写」与自动数据相同时 → 整体替换该会议（years 以覆盖层为准）
#   - 覆盖层独有的缩写 → 新增会议
#   - 未提供的可选字段（l/f/d）会沿用自动数据；新增会议则留空
#
# 字段说明：
#   a  缩写（必填）
#   n  全称（必填）
#   l  CCF 等级：A / B / C（可选，非 CCF 会议省略）
#   f  领域（CCF 官方中文名，可选，如：人工智能 / 数据库/数据挖掘/内容检索）
#   d  DBLP 链接（可选）
#   years:
#     y     年份（必填）
#     link  会议官网（可选）
#     tz    时区（可选，默认 UTC；支持 AoE / UTC±X / IANA 名，如 Asia/Shanghai）
#     date  会议时间描述（可选，如 "July 2027"）
#     place 会议地点（可选）
#     timeline:  投稿轮次（必填至少一条）
#       - t: 截止时间 "YYYY-MM-DD HH:mm:ss"（必填）
#         c: 轮次备注（可选，如 "first round"）
#         k: 类型（可选，"abstract" 表示摘要截止；缺省为全文截止）
conferences: []
