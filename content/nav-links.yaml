# 学术导航链接
# 字段说明：
#   group  分组名，支持 zh / en（必填）
#   links  链接数组：
#     name  名称，支持 zh / en（必填）
#     url   URL（必填）
#     desc  描述，支持 zh / en（可选）
#     icon  可选：iconify 图标名，如 "simple-icons:googlescholar"
groups:
  - group:
      zh: 论文搜索
      en: Paper Search
    links:
      - name:
          zh: Google Scholar
          en: Google Scholar
        url: "https://scholar.google.com/"
        desc:
          zh: 学术搜索与引用追踪
          en: Academic search & citation tracking
        icon: simple-icons:googlescholar
      - name:
          zh: arXiv
          en: arXiv
        url: "https://arxiv.org/"
        desc:
          zh: 预印本论文库
          en: Preprint repository
        icon: simple-icons:arxiv
