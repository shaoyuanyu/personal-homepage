# 学术导航链接
# 字段说明：
#   group  分组名，支持 zh / en（必填）
#   links  链接数组：
#     name  名称（必填）
#     url   URL（必填）
#     desc  描述，支持 zh / en（可选）
#     icon  可选：iconify 图标名，如 "simple-icons:googlescholar"
groups:
  - group:
      zh: 论文搜索
      en: Paper Search
    links:
      - name: Google Scholar
        url: "https://scholar.google.com/"
        desc:
          zh: 学术搜索与引用追踪
          en: Academic search & citation tracking
        icon: simple-icons:googlescholar
      - name: arXiv
        url: "https://arxiv.org/"
        desc:
          zh: 预印本论文库
          en: Preprint repository
        icon: simple-icons:arxiv
      - name: DBLP
        url: "https://dblp.org/"
        desc:
          zh: 计算机科学文献库
          en: CS bibliography database
        icon: simple-icons:dblp
      - name: Semantic Scholar
        url: "https://www.semanticscholar.org/"
        desc:
          zh: AI 驱动的论文检索
          en: AI-powered paper search
        icon: simple-icons:semanticscholar
      - name: Connected Papers
        url: "https://www.connectedpapers.com/"
        desc:
          zh: 论文关联图谱
          en: Explore paper relationships
      - name: Paper Digest
        url: "https://www.paperdigest.org/"
        desc:
          zh: 论文摘要与动态
          en: Paper digests & updates
      - name: IEEE Xplore
        url: "https://ieeexplore.ieee.org/"
        desc:
          zh: 电气与电子工程文献库
          en: IEEE digital library
        icon: simple-icons:ieee
      - name: PASA Agent
        url: "https://pasa-agent.ai/"
        desc:
          zh: 论文检索智能体
          en: AI paper search agent
  - group:
      zh: 开源平台
      en: Open-source Platforms
    links:
      - name: GitHub
        url: "https://github.com/"
        desc:
          zh: 代码托管
          en: Code hosting
        icon: simple-icons:github
      - name: Hugging Face
        url: "https://huggingface.co/"
        desc:
          zh: 模型与数据集平台
          en: Models & datasets hub
        icon: simple-icons:huggingface
  - group:
      zh: 写作与排版
      en: Writing & Typesetting
    links:
      - name: Overleaf
        url: "https://www.overleaf.com/"
        desc:
          zh: 在线 LaTeX 协作
          en: Online LaTeX editor
        icon: simple-icons:overleaf
      - name: Grammarly
        url: "https://www.grammarly.com/"
        desc:
          zh: 英文写作校对
          en: English writing assistant
        icon: simple-icons:grammarly
