name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # pnpm 版本由 package.json 的 packageManager 字段决定（pnpm@10.33.0）

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate content layer
        run: pnpm exec velite --clean

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Fetch favicons
        run: pnpm fetch:favicons

      - name: Build
        run: pnpm build

      - name: Smoke test (local standalone)
        # 构建产物冒烟：启动 standalone server 跑 Playwright（无需重新构建）
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm start > /tmp/e2e-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          pnpm exec playwright test
