name: Sync Deadlines

# 每 12 小时自动同步 CCF 会议 deadline 数据（ccfddl），有变化时提交 PR
on:
  schedule:
    - cron: "0 */12 * * *" # 每 12 小时（UTC 0 点与 12 点）
  workflow_dispatch:

# 仓库创建于 2023-02-02 之后，GITHUB_TOKEN 默认只读；
# create-pull-request 需要推送分支 + 创建 PR，必须显式提升权限（否则 403）。
permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync conference deadlines from ccfddl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync deadlines
        run: node scripts/fetch-deadlines.mjs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: sync conference deadlines from ccfddl"
          branch: chore/sync-deadlines
          title: "⏰ 会议 Deadline 数据自动同步"
          body: |
            每周自动同步脚本检测到 CCF 会议 deadline 数据更新（来源：ccfddl/ccf-deadlines），请确认后合并。
          delete-branch: true
          labels: automation
