name: Sync Deadlines

# 每 12 小时自动同步 CCF 会议 deadline 数据（ccfddl），有变化时提交 PR
on:
  schedule:
    - cron: "0 */12 * * *" # 每 12 小时（UTC 0 点与 12 点）
  workflow_dispatch:

# 仓库创建于 2023-02-02 之后，GITHUB_TOKEN 默认只读；
# create-pull-request 需要推送分支 + 创建 PR，必须显式提升权限（否则 403）。
permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync conference deadlines from ccfddl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync deadlines
        run: node scripts/fetch-deadlines.mjs

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: sync conference deadlines from ccfddl"
          branch: chore/sync-deadlines
          title: "⏰ 会议 Deadline 数据自动同步"
          body: |
            每 12 小时自动同步脚本检测到 CCF 会议 deadline 数据更新（来源：ccfddl/ccf-deadlines），请确认后合并。
          delete-branch: true

      # GITHUB_TOKEN 无法「启用 automerge」（GitHub 限制，需 PAT 或 GitHub App），
      # 因此配置 AUTOMERGE_TOKEN secret 后走原生 auto-merge；
      # 未配置 secret 时回退为 GITHUB_TOKEN 立即合并（pull-requests: write 即可）。
      # 注意：GITHUB_TOKEN 的合并 push 不触发 ci/deploy（防循环机制），
      # 线上数据由「立即同步」按钮（运行时 data/deadlines.json）或下次部署承载。
      - name: Enable auto-merge
        id: am
        if: steps.cpr.outputs.pull-request-number != '' && secrets.AUTOMERGE_TOKEN != ''
        continue-on-error: true
        run: |
          gh pr merge --auto --squash --delete-branch "${{ steps.cpr.outputs.pull-request-url }}"
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}

      # PAT 未配置或启用 automerge 失败（如 PAT 权限不足/无效）时，
      # 降级为 GITHUB_TOKEN 立即合并，保证数据入库不被阻塞。
      - name: Auto-merge sync PR (fallback)
        if: steps.cpr.outputs.pull-request-number != '' && (secrets.AUTOMERGE_TOKEN == '' || steps.am.outcome == 'failure')
        run: |
          gh pr merge --squash --delete-branch "${{ steps.cpr.outputs.pull-request-url }}"
        env:
          GH_TOKEN: ${{ github.token }}
