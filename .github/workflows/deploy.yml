name: Deploy

on:
  push:
    branches: [main]
    # 纯文档改动不触发部署（镜像内容不变，避免白等 15~30 分钟）
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}:latest

jobs:
  build-and-deploy:
    name: Build Image & Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 35m
          # VPS → GHCR 偶发连接卡死（国内网络），pull 加重试与超时兜底
          script: |
            set -e
            cd ~/personal-homepage
            for i in 1 2 3; do
              echo "=== 尝试拉取镜像（第 $i 次）==="
              if timeout 600 docker pull ${{ env.IMAGE }}; then
                break
              fi
              if [ "$i" -lt 3 ]; then
                echo "!!! 拉取失败，10 秒后重试"
                sleep 10
              else
                echo "!!! 三次拉取均失败，终止部署"
                exit 1
              fi
            done
            docker compose up -d --no-deps web
            docker image prune -f

  smoke-test:
    name: Smoke Test (Production)
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test production
        # 对线上站点跑同一套冒烟用例（页面 200 / 301 跳转 / OG 图 / 资源）
        # ⚠ --retries=1：跨海链路（runner 在海外、站点在国内 VPS）偶发超时，
        #   1 次重试滤掉瞬时时序抖动；确定性缺陷重试后仍会失败，不会掩盖真问题。
        # --reporter=list,html：配合下面的工件上传，失败时可直接下载报告与 trace。
        env:
          E2E_BASE_URL: https://shaoyuanyu.cn
        run: pnpm exec playwright test --retries=1 --reporter=list,html

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-production
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
