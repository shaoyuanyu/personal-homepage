name: Deploy

on:
  push:
    branches: [main]
    # 纯文档改动不触发部署（镜像内容不变）
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      version:
        description: "回滚：web 镜像版本号（如 2026.10.07-7475b30）。留空 = 正常构建流程"
        required: false
        type: string
      webmail_version:
        description: "回滚：webmail 镜像版本号（如 2026.10.07-69642d6）。留空 = 回滚时不动 webmail"
        required: false
        type: string

# 部署串行化：两次快速 push 不会并发改线上
concurrency:
  group: deploy-production
  cancel-in-progress: false

# ============================================================================
# 构建与推送**全部由阿里云 ACR 完成**，GHA 只做编排。涉及两个代码仓库：
#
#   ysy-homepage-web      → ACR 镜像仓库 ysy-homepage-web      （网站镜像）
#   ysy-homepage-webmail  → ACR 镜像仓库 ysy-homepage-webmail  （邮件后端镜像）
#
# 两个 ACR 镜像仓库各自绑定对应的 GitHub 仓库，由各自的**内置规则**
# （tags:release-v$version → 镜像版本 $version）构建**各自仓库根的 Dockerfile**：
# 两边根 Dockerfile 正是各自服务的构建文件，天然正确、不需要任何自定义规则。
#
# 正常流程：
#   1. main 推送 → 本工作流算版本号并打标签：
#        · 版本号 = <该仓库提交日期(UTC)>-<短SHA>——**取提交自身的日期，不是部署
#          日期**。同一个提交永远同一个版本号，因此没改动的镜像不会因为"跨了一天"
#          被重新构建、容器也不会白重启（邮件镜像是最慢的一个，收益最明显）；
#        · 标签与镜像都已存在 → **直接复用**（不重推、不重建）；
#          标签在但镜像被清理过 → 删标签重推，触发重建；
#        · 邮件仓库的版本号取自该仓库自身 HEAD（两仓库历史独立），标签经
#          deploy key 跨仓库推送（deploy key 推送是普通 push 事件，ACR 正常收到）。
#   2. ACR 两侧各自检测标签 → 构建并产出同名版本号镜像（产物经阿里云内部链路上架）；
#      GHA 侧**不跑任何 docker build/push**；
#   3. 本工作流轮询两个版本号镜像"是否已经可拉取"——只等有没有，**不校验内容**
#      （内容校验在 VPS 侧 deploy.sh 里做，见下）；
#   4. SSH 到 VPS：登录 ACR → 调用 VPS 上的 ~/personal-homepage/deploy.sh
#      <web版本> [<邮件版本>] → 拉取、校验入口 Cmd、重建容器、健康探测、清理旧版本。
#
# 为什么部署逻辑在 VPS 上而不在本文件里：
#   · 回滚不该依赖 GitHub / Actions / PAT / deploy key 同时健康——SSH 上去一条
#     命令就能退回上一版（`bash ~/personal-homepage/deploy.sh <旧版本>`）；
#   · 流水线部署与手工回滚走**同一份实现**，不会出现"YAML 里改好了、手工那条路
#     还是旧逻辑"的漂移；
#   · 入口 Cmd 校验放在"拉取后、起容器前"（历史教训：ACR 规则误配时 webmail 镜像
#     里装成过 web 应用，全链路无报错），校验失败时旧容器仍在跑，线上不受影响。
#   ⚠ 仓库 scripts/deploy.sh 是唯一事实来源，改完必须 scp 同步到 VPS，否则流水线
#     跑的还是旧脚本（部署步骤会在脚本缺失时明确报错并给出同步命令）。
#
# 回滚：workflow_dispatch —— version 填 web 旧版本号、webmail_version 填邮件旧
#   版本号（两个镜像的全部版本都留在 ACR，各自永不覆写）。只填 version 时仅回滚
#   web、webmail 保持现状（但仍会健康探测它）。
#
# 为什么不在 GHA 构建：GHA runner 在海外，推 ACR 跨境上行实测 <60KB/s
#   （84.7 MB 的 web 镜像 30+ 分钟推不完）→ 此路不通。ACR 侧构建时跨境流量
#   只剩源码（~11 MB）。
#
# 依赖：仓库 Variables  REGISTRY（ACR 公网地址）/ IMAGE_NAMESPACE（命名空间）
#      仓库 Secrets    REGISTRY_USERNAME / REGISTRY_PASSWORD（私有镜像仓库）
#                      WEBMAIL_REPO_DEPLOY_KEY（邮件后端仓库 deploy key，
#                      写权限——跨仓库推标签；deploy key 推送是普通 push 事件，
#                      正常送达 ACR）
#                      VPS_HOST / VPS_USER / VPS_SSH_KEY
#      Secret（可选）  AUTOMERGE_TOKEN（PAT）：推主仓库标签时优先使用
#                      （GITHUB_TOKEN 推送的事件是否送达 ACR 未实测；PAT 一定送达）
# ============================================================================

jobs:
  build-and-deploy:
    name: Trigger ACR Build & Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 推 release-v* 标签以触发 ACR 构建
    env:
      # 可选 PAT：优先用于推主仓库标签。未配置时为空串（回退 GITHUB_TOKEN）。
      PUSH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image registry & version
        # 正常模式：版本号 = <提交日期(UTC)>-<短SHA>（webmail 的版本号在打标签步骤
        # 由邮件仓库自身 HEAD 算出）。回滚模式（填了 version 输入）：跳过构建，
        # 直接部署指定版本。
        env:
          IN_REGISTRY: ${{ vars.REGISTRY }}
          IN_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
          IN_VERSION: ${{ github.event.inputs.version }}
          IN_WEBMAIL_VERSION: ${{ github.event.inputs.webmail_version }}
        run: |
          REGISTRY="${IN_REGISTRY:?未配置仓库 Variable REGISTRY（ACR 公网地址）}"
          NAMESPACE="${IN_NAMESPACE:?未配置仓库 Variable IMAGE_NAMESPACE（ACR 命名空间）}"
          REPO="${{ github.event.repository.name }}"        # ysy-homepage-web
          WEBMAIL_REPO="ysy-homepage-webmail"
          {
            echo "REGISTRY=$REGISTRY"
            echo "NAMESPACE=$NAMESPACE"
            echo "REPO=$REPO"
            echo "WEBMAIL_REPO=$WEBMAIL_REPO"
          } >> "$GITHUB_ENV"
          if [ -n "$IN_VERSION" ]; then
            echo "回滚模式：web=$IN_VERSION；webmail=${IN_WEBMAIL_VERSION:-（保持现状，不动）}"
            {
              echo "VERSION=$IN_VERSION"
              echo "IMAGE=$REGISTRY/$NAMESPACE/$REPO:$IN_VERSION"
              echo "SKIP_BUILD=1"
            } >> "$GITHUB_ENV"
            if [ -n "$IN_WEBMAIL_VERSION" ]; then
              {
                echo "WEBMAIL_VERSION=$IN_WEBMAIL_VERSION"
                echo "WEBMAIL_IMAGE=$REGISTRY/$NAMESPACE/$WEBMAIL_REPO:$IN_WEBMAIL_VERSION"
              } >> "$GITHUB_ENV"
            fi
          else
            # ⚠ TZ=UTC 固定时区：否则 runner 时区一变，同一个提交会算出两个版本号
            VERSION="$(TZ=UTC git show -s --format=%cd --date=format:%Y.%m.%d HEAD)-${GITHUB_SHA:0:7}"
            echo "本次 web 版本：$VERSION（提交日期-短SHA；webmail 版本在打标签步骤确定）"
            {
              echo "VERSION=$VERSION"
              echo "RELEASE_TAG=release-v$VERSION"
              echo "IMAGE=$REGISTRY/$NAMESPACE/$REPO:$VERSION"
            } >> "$GITHUB_ENV"
          fi

      - name: Login to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Create release tags (triggers ACR builds)
        if: env.SKIP_BUILD != '1'
        env:
          WM_DEPLOY_KEY: ${{ secrets.WEBMAIL_REPO_DEPLOY_KEY }}
        run: |
          set -e

          # 打标签的唯一目的 = 让 ACR 构建。因此三种情况分开处理：
          #   标签 + 镜像都在  → 复用（同一个提交就是同一份产物，不重推不重建）
          #   标签在、镜像没了 → 删标签重推（控制台清理过 / 上次构建失败）
          #   标签不在        → 正常推送
          push_tag_if_needed() {
            tag="$1"; image="$2"
            if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
              if docker manifest inspect "$image" >/dev/null 2>&1; then
                echo "复用：标签 $tag 与镜像均已存在，跳过重建"
                return 0
              fi
              echo "标签 $tag 已存在但镜像缺失，删除后重推以触发重建"
              git push origin ":refs/tags/$tag" || true
            fi
            git tag -f "$tag"
            git push origin "$tag"
            echo "已推送标签：$tag（ACR 开始构建）"
          }

          # ---- 主仓库（web）：PAT 优先（保证 ACR 的 GitHub App 收到事件），
          #      GITHUB_TOKEN 回退。----
          if [ -n "$PUSH_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          push_tag_if_needed "$RELEASE_TAG" "$IMAGE"

          # ---- 邮件后端仓库（webmail）：deploy key 跨仓库推标签。版本号取邮件
          #      仓库自身 HEAD 的提交日期 + 短 SHA（两仓库历史独立）。----
          if [ -z "$WM_DEPLOY_KEY" ]; then
            echo "!!! 未配置 WEBMAIL_REPO_DEPLOY_KEY（邮件仓库 deploy key），无法推 webmail 标签"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$WM_DEPLOY_KEY" > ~/.ssh/wm_deploy_key
          chmod 600 ~/.ssh/wm_deploy_key
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/wm_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          WM_URL="git@github.com:${{ github.repository_owner }}/$WEBMAIL_REPO.git"
          rm -rf /tmp/wm-repo
          git clone --depth 1 "$WM_URL" /tmp/wm-repo
          cd /tmp/wm-repo
          WM_SHA="$(git rev-parse --short=7 HEAD)"
          WM_VERSION="$(TZ=UTC git show -s --format=%cd --date=format:%Y.%m.%d HEAD)-$WM_SHA"
          WM_IMAGE="$REGISTRY/$NAMESPACE/$WEBMAIL_REPO:$WM_VERSION"
          push_tag_if_needed "release-v$WM_VERSION" "$WM_IMAGE"
          cd - >/dev/null
          {
            echo "WEBMAIL_VERSION=$WM_VERSION"
            echo "WEBMAIL_IMAGE=$WM_IMAGE"
          } >> "$GITHUB_ENV"

      - name: Wait for ACR builds
        if: env.SKIP_BUILD != '1'
        run: |
          # 只判断两个版本号镜像**是否已经可拉取**——内容校验（Cmd 里必须有
          # server.js / tsx）在 VPS 侧 deploy.sh 里做：那里是在"拉取后、起容器前"
          # 检查本地镜像，既没有 buildx 缩进 JSON 那类坑，又能在校验失败时保住
          # 正在跑的旧容器。标签被复用时这里第一轮就会通过。
          deadline=$((SECONDS + 2400))   # 40 分钟（ACR 单次构建上限 30 分钟）
          while true; do
            web_ok=0; webmail_ok=0
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then web_ok=1; fi
            if docker manifest inspect "$WEBMAIL_IMAGE" >/dev/null 2>&1; then webmail_ok=1; fi
            if [ "$web_ok" = 1 ] && [ "$webmail_ok" = 1 ]; then
              echo "两个镜像均已就绪：web=$VERSION webmail=$WEBMAIL_VERSION"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "!!! 等待超时（40 分钟）：web=$web_ok webmail=$webmail_ok"
              echo "!!! 到 ACR 控制台对应镜像仓库的「构建日志」页排查："
              echo "!!!   $REGISTRY/$NAMESPACE/$REPO 与 $REGISTRY/$NAMESPACE/$WEBMAIL_REPO"
              echo "!!! 若日志显示构建成功：用 workflow_dispatch 把 version / webmail_version"
              echo "!!! 填成 ${VERSION} / ${WEBMAIL_VERSION} 重跑，会跳过等待直接部署。"
              exit 1
            fi
            sleep 20
          done

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          # 部署/回滚的实现在 VPS 上的 ~/personal-homepage/deploy.sh（= 仓库
          # scripts/deploy.sh 的副本）：拉取 + 入口 Cmd 校验 + 重建 + 健康探测 +
          # 旧版本清理。这里只负责登录 ACR 并把版本号传进去。
          script: |
            set -e
            DEPLOY_SH="$HOME/personal-homepage/deploy.sh"
            if [ ! -f "$DEPLOY_SH" ]; then
              echo "!!! VPS 上缺少部署脚本 $DEPLOY_SH（未同步或路径变了）"
              echo "!!! 同步（仓库 scripts/deploy.sh 是唯一事实来源）："
              echo "!!!   scp -i ~/.ssh/vps-deploy scripts/deploy.sh <user>@<host>:~/personal-homepage/deploy.sh"
              exit 1
            fi
            if [ -n "${{ secrets.REGISTRY_PASSWORD }}" ]; then
              echo "${{ secrets.REGISTRY_PASSWORD }}" \
                | docker login "${{ env.REGISTRY }}" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
            fi
            # 版本号与仓库名由流水线传入；WEBMAIL_VERSION 为空 = 本次只动 web
            REGISTRY="${{ env.REGISTRY }}" \
            NAMESPACE="${{ env.NAMESPACE }}" \
            WEB_REPO="${{ env.REPO }}" \
            WEBMAIL_REPO="${{ env.WEBMAIL_REPO }}" \
            bash "$DEPLOY_SH" "${{ env.VERSION }}" "${{ env.WEBMAIL_VERSION }}"

  smoke-test:
    name: Smoke Test (Production)
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test production
        # 对线上站点跑同一套冒烟用例（页面 200 / 301 跳转 / OG 图 / 资源）
        # ⚠ --retries=1：跨海链路（runner 在海外、站点在国内 VPS）偶发超时，
        #   1 次重试滤掉瞬时时序抖动；确定性缺陷重试后仍会失败，不会掩盖真问题。
        # --reporter=list,html：配合下面的工件上传，失败时可直接下载报告与 trace。
        # ⚠ 这里只看游客视角：站主用例需要 TOTP_SECRET，生产上会真改线上数据，
        #   故不注入；站内邮箱（webmail 容器，不暴露公网）的健康由部署脚本的
        #   健康探测负责，公网冒烟测不到它。
        env:
          E2E_BASE_URL: https://shaoyuanyu.cn
        run: pnpm exec playwright test --retries=1 --reporter=list,html

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-production
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
