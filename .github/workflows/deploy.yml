name: Deploy

on:
  push:
    branches: [main]
    # 纯文档改动不触发部署（镜像内容不变，避免白等 15~30 分钟）
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      version:
        description: "部署指定版本（留空 = 正常构建流程；回退时填旧版本号，如 2026.10.07-d2b3dc7）"
        required: false
        type: string

# 部署串行化：两次快速 push 不会并发改线上
concurrency:
  group: deploy-production
  cancel-in-progress: false

# 构建与推送**全部由阿里云 ACR 完成**（个人版构建服务），GHA 只做编排：
#   1. main 推送 → 本工作流给该 commit 打 release-v<日期>-<短SHA> 标签并 push；
#   2. ACR 侧构建（海外构建机拉源码 / Docker Hub，产物经阿里云内部链路上架）：
#      两个仓库各建一条构建规则 tags:release-v$version → 镜像版本 $version，
#      各自原生产出带版本号的镜像（webmail 仓库为自定义规则：镜像版本字段实测
#      接受 $version；⚠ Dockerfile 文件名必须指向仓库根的 webmail.Dockerfile，
#      填成 Dockerfile 会静默构建出 web 应用——等待步骤有 Cmd 校验兜底）；
#      GHA 侧不再跑任何 docker build/push；
#   3. 本工作流轮询两个**版本号镜像**就绪；
#      ⚠ 兜底：webmail 版本号镜像 ① 内容错误（Cmd=server.js）或 ② web 就绪后
#      12 分钟内仍未出现 → 自动在 VPS 上桥接构建 webmail 并覆盖推回 ACR
#      （规则失效/误配时流水线仍能跑通，正常情况下不会触发；触发时日志明确标注）；
#   4. VPS 拉取镜像并重建容器（两个镜像均按版本号钉死，境内秒级）。
#   回退：workflow_dispatch 把 version 填成旧版本号重跑（两个镜像的旧版本都永远
#   留在 ACR 版本列表里，不会被覆写）。
#
# 为什么不在 GHA 构建：GHA runner 在海外，推 ACR 走公网跨境上行实测 <60KB/s
#   （84.7 MB 的 web 镜像 30+ 分钟没推完）→ 此路不通。ACR 侧构建时跨境流量只剩
#   源码（~11 MB）。
#
# 依赖：仓库 Variables  REGISTRY（ACR 公网地址）/ IMAGE_NAMESPACE（命名空间）
#      仓库 Secrets    REGISTRY_USERNAME / REGISTRY_PASSWORD
#                      （私有仓库：GHA 拉 manifest 校验 + VPS 登录拉镜像）
#      Secret（可选）  AUTOMERGE_TOKEN（PAT）：用于推标签——GITHUB_TOKEN 推送
#                      的事件是否会送达 ACR 的 GitHub App 未经实测，PAT 一定送达；
#                      未配置时回退 GITHUB_TOKEN（若 ACR 未收到触发，配一个即可）。
#   IMAGE / WEBMAIL_IMAGE 由 "Resolve image registry & version" 写入 $GITHUB_ENV。

jobs:
  build-and-deploy:
    name: Trigger ACR Build & Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 推 release-v* 标签以触发 ACR 构建
    env:
      # 可选 PAT：优先用于推标签（保证 ACR 的 GitHub App 收到事件）。未配置时为空串。
      PUSH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image registry & version
        # VERSION = <日期>-<短SHA>（如 2026.10.07-d2b3dc7）：两个镜像的构建 tag
        # 与部署/回退锚点。手动触发且填了 version 输入（回退场景）时直接采用该
        # 版本，并跳过「打标签 + 等构建」。
        env:
          IN_REGISTRY: ${{ vars.REGISTRY }}
          IN_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
          IN_VERSION: ${{ github.event.inputs.version }}
        run: |
          REGISTRY="${IN_REGISTRY:?未配置仓库 Variable REGISTRY（ACR 公网地址）}"
          NAMESPACE="${IN_NAMESPACE:?未配置仓库 Variable IMAGE_NAMESPACE（ACR 命名空间）}"
          REPO="${{ github.event.repository.name }}"
          if [ -n "$IN_VERSION" ]; then
            VERSION="$IN_VERSION"
            echo "手动指定版本：$VERSION（跳过构建，直接部署该版本）"
            echo "SKIP_BUILD=1" >> "$GITHUB_ENV"
          else
            VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA:0:7}"
            echo "本次版本：$VERSION（将由 ACR 构建）"
          fi
          # webmail 镜像的仓库名 = <仓库名>-webmail（ACR 侧需先建好对应仓库）
          {
            echo "REGISTRY=$REGISTRY"
            echo "NAMESPACE=$NAMESPACE"
            echo "REPO=$REPO"
            echo "VERSION=$VERSION"
            echo "RELEASE_TAG=release-v$VERSION"
            echo "IMAGE=$REGISTRY/$NAMESPACE/$REPO:$VERSION"
            echo "WEBMAIL_IMAGE=$REGISTRY/$NAMESPACE/$REPO-webmail:$VERSION"
          } >> "$GITHUB_ENV"

      - name: Login to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Create release tag (triggers ACR build)
        if: env.SKIP_BUILD != '1'
        run: |
          # 优先 PAT 推标签：GITHUB_TOKEN 推送的事件是否会送达 ACR 的 GitHub App
          # 未经实测，PAT 一定送达；未配置则回退（行为见文件头「依赖」注释）。
          if [ -n "$PUSH_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          # 标签已存在（重跑/同日重发）时删除重推：只有新的标签 push 事件才会触发
          # ACR 构建（webmail 的上次构建可能失败过，必须重试而不是假设成功）。
          if git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | grep -q .; then
            echo "标签 $RELEASE_TAG 已存在，删除后重推以重新触发构建"
            git push origin ":refs/tags/$RELEASE_TAG" || true
          fi
          git tag -f "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          echo "已推送 $RELEASE_TAG —— ACR 检测到标签后自动构建 web / webmail 两个镜像"

      - name: Wait for ACR build
        if: env.SKIP_BUILD != '1'
        run: |
          # 就绪判据：两个仓库的**版本号镜像**都出现（两条规则均为
          # tags:release-v$version → 镜像版本 $version）。
          # 兜底（桥接）：web 就绪后 webmail 宽限期内仍未产出 → 判定 ACR 的
          # webmail 构建规则未生效，在 VPS 上构建 webmail 并推回 ACR（国内直连、
          # 有层缓存；正常情况下不会触发，触发时日志会明确标注）。webmail 构建
          # 比 web 慢（实测约 +5 分钟，better-sqlite3 编译），宽限期取 12 分钟。
          # 个人版单次构建上限 30 分钟，预算 55 分钟（含桥接），每 20 秒轮询。
          deadline=$((SECONDS + 3300))
          BRIDGE_GRACE=720
          bridge_done=0
          web_ready_at=""
          while true; do
            web_ok=0; webmail_ok=0; webmail_wrong=0
            docker manifest inspect "$IMAGE" >/dev/null 2>&1 && web_ok=1
            if docker manifest inspect "$WEBMAIL_IMAGE" >/dev/null 2>&1; then
              # 内容校验：ACR 的 webmail 构建规则若误用根 Dockerfile，产出的是 web
              # 应用（Cmd = node server.js）——必须改走桥接覆盖该 tag。正确镜像的
              # 入口是 tsx（webmaild）。
              # ⚠ buildx 的 json 模板输出是**缩进**的（换行+空格）——必须先压平再
              # 用 grep -F 定点匹配（曾因单行正则匹配缩进 JSON 而静默失效，错误
              # 镜像直接上了生产）。拿不到 config 时按就绪处理（保守，会打警告）。
              wm_cfg="$(docker buildx imagetools inspect --format '{{json .Image}}' "$WEBMAIL_IMAGE" 2>/dev/null | tr -d '[:space:]' || true)"
              [ -n "$wm_cfg" ] || echo "（警告：webmail 镜像 config 校验不可用，跳过内容检查——若 ACR 规则误配将无法拦截）"
              if printf '%s' "$wm_cfg" | grep -qF '"Cmd":["node","server.js"]'; then
                webmail_wrong=1
              else
                webmail_ok=1
              fi
            fi
            if [ "$web_ok" = 1 ] && [ "$webmail_ok" = 1 ]; then
              echo "两个镜像均已就绪：$VERSION"
              break
            fi
            if [ "$web_ok" = 1 ] && [ -z "$web_ready_at" ]; then
              web_ready_at=$SECONDS
            fi
            do_bridge=0
            if [ "$webmail_wrong" = 1 ]; then
              do_bridge=1   # 内容错误：ACR 侧不会再修正，立即桥接
            elif [ -n "$web_ready_at" ] && [ "$((SECONDS - web_ready_at))" -ge "$BRIDGE_GRACE" ]; then
              do_bridge=1   # 未产出：宽限期到期
            fi
            if [ "$web_ok" = 1 ] && [ "$webmail_ok" = 0 ] && [ "$bridge_done" = 0 ] && [ "$do_bridge" = 1 ]; then
              bridge_done=1
              if [ "$webmail_wrong" = 1 ]; then
                echo "=== ACR 产出的 webmail 镜像内容错误（Cmd=server.js，构建规则疑似误用根 Dockerfile）——启用 VPS 桥接构建并覆盖该 tag ==="
              else
                echo "=== ACR webmail 构建在宽限期内未产出，启用 VPS 桥接构建（兜底路径） ==="
              fi
              install -d -m 700 ~/.ssh
              printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/bridge_key
              chmod 600 ~/.ssh/bridge_key
              BRIDGE_SSH="ssh -i $HOME/.ssh/bridge_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
              cat > /tmp/bridge-remote.sh <<EOS
          set -e
          cd /tmp/webmail-bridge
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
          docker build -f webmail.Dockerfile -t "$WEBMAIL_IMAGE" .
          docker push "$WEBMAIL_IMAGE"
          echo "桥接构建已推送：$WEBMAIL_IMAGE"
          cd / && rm -rf /tmp/webmail-bridge
          EOS
              # 源码（当前 checkout = 本次 tag 的提交）直传 VPS，再远程构建+推送
              git archive HEAD | $BRIDGE_SSH 'rm -rf /tmp/webmail-bridge && mkdir -p /tmp/webmail-bridge && tar -xf - -C /tmp/webmail-bridge' \
                && echo "源码已送达 VPS"
              $BRIDGE_SSH 'bash -s' < /tmp/bridge-remote.sh || echo "!!! 桥接构建失败（详见上方输出）"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "!!! 等待超时（55 分钟）：web=$web_ok webmail=$webmail_ok"
              echo "!!! 到 ACR 控制台对应仓库的「构建日志」页排查："
              echo "!!!   $REGISTRY/$NAMESPACE/$REPO 与 $REGISTRY/$NAMESPACE/$REPO-webmail"
              echo "!!! 若日志显示构建成功：用 workflow_dispatch 把 version 填成"
              echo "!!! ${VERSION} 重跑，会跳过等待直接部署。"
              exit 1
            fi
            sleep 20
          done

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          # ACR 为私有仓库，VPS 侧需登录；override 把两个镜像都按版本号钉死。
          # 回退 = workflow_dispatch 把 version 填成旧版本号重跑本工作流
          #（拉取+重建+生产冒烟完整走一遍，两个镜像一起回退）。
          script: |
            set -e
            cd ~/personal-homepage

            REGISTRY="${{ env.REGISTRY }}"
            NAMESPACE="${{ env.NAMESPACE }}"
            REPO="${{ env.REPO }}"
            VERSION="${{ env.VERSION }}"
            WEB_IMAGE="${{ env.IMAGE }}"
            WEBMAIL_IMAGE="${{ env.WEBMAIL_IMAGE }}"

            if [ -n "${{ secrets.REGISTRY_PASSWORD }}" ]; then
              echo "${{ secrets.REGISTRY_PASSWORD }}" \
                | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
            fi

            # 前置校验：override 文件只提供 image:。若 VPS 上那份 docker-compose.yml
            # 缺服务定义（例如新增的 webmail 还没同步过去），compose 会「凭一个 image
            # 造出没有网络/挂载/环境变量的空壳服务」而不是报错——宁可在这里大声失败。
            for svc in web webmail; do
              if ! docker compose -f docker-compose.yml config --services | grep -qx "$svc"; then
                echo "!!! VPS 上的 docker-compose.yml 缺少服务 $svc，请先同步仓库里的该文件"
                exit 1
              fi
            done

            # 用 override 文件显式钉住本次部署的镜像，而不是依赖 VPS 上那份
            # docker-compose.yml 的 image: 行——VPS 的仓库副本可能滞后于 main，
            # 否则会出现「仓库里改了镜像地址、线上却还在拉旧地址」的静默错配。
            cat > /tmp/registry-override.yml <<EOF
            services:
              web:
                image: $WEB_IMAGE
              webmail:
                image: $WEBMAIL_IMAGE
            EOF

            for img in "$WEB_IMAGE" "$WEBMAIL_IMAGE"; do
              for i in 1 2 3; do
                echo "=== 拉取 $img（第 $i 次）==="
                if timeout 600 docker pull "$img"; then
                  break
                fi
                if [ "$i" -lt 3 ]; then
                  echo "!!! 拉取失败，10 秒后重试"
                  sleep 10
                else
                  echo "!!! 三次拉取均失败，终止部署"
                  exit 1
                fi
              done
            done
            docker compose -f docker-compose.yml -f /tmp/registry-override.yml up -d --no-deps web webmail

            # 版本清理：每个仓库只保留最近 5 个版本（版本号以日期开头，倒序即新旧序）。
            # 只统计「版本号格式」的 tag（YYYY.MM.DD-*）——ACR 构建缓存镜像
            # （__ACR_BUILD_SERVICE_INTERNAL_IMAGE_CACHE）与历史遗留普通标签不占额度。
            # 正在使用的镜像 docker rmi 会拒绝删除；保留最近若干版便于随时回退。
            for r in "$REPO" "$REPO-webmail"; do
              docker images "$REGISTRY/$NAMESPACE/$r" --format '{{.Tag}}' | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-' \
                | sort -r | tail -n +6 | while read -r t; do
                    echo "清理旧版本：$r:$t"
                    docker rmi "$REGISTRY/$NAMESPACE/$r:$t" || true
                  done || true
            done
            docker image prune -f

  smoke-test:
    name: Smoke Test (Production)
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test production
        # 对线上站点跑同一套冒烟用例（页面 200 / 301 跳转 / OG 图 / 资源）
        # ⚠ --retries=1：跨海链路（runner 在海外、站点在国内 VPS）偶发超时，
        #   1 次重试滤掉瞬时时序抖动；确定性缺陷重试后仍会失败，不会掩盖真问题。
        # --reporter=list,html：配合下面的工件上传，失败时可直接下载报告与 trace。
        env:
          E2E_BASE_URL: https://shaoyuanyu.cn
        run: pnpm exec playwright test --retries=1 --reporter=list,html

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-production
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
