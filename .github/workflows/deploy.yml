name: Deploy

on:
  push:
    branches: [main]
    # 纯文档改动不触发部署（镜像内容不变）
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      version:
        description: "回滚：web 镜像版本号（如 2026.10.07-abc1234）。留空 = 正常构建流程"
        required: false
        type: string
      webmail_version:
        description: "回滚：webmail 镜像版本号（如 2026.10.07-def5678）。留空 = 回滚时不动 webmail"
        required: false
        type: string

# 部署串行化：两次快速 push 不会并发改线上
concurrency:
  group: deploy-production
  cancel-in-progress: false

# ============================================================================
# 构建与推送**全部由阿里云 ACR 完成**，GHA 只做编排。涉及两个代码仓库：
#
#   ysy-homepage-web      → ACR 镜像仓库 ysy-homepage-web      （网站镜像）
#   ysy-homepage-webmail  → ACR 镜像仓库 ysy-homepage-webmail  （邮件后端镜像）
#
# 两个 ACR 镜像仓库各自绑定对应的 GitHub 仓库，由各自的**内置规则**
# （tags:release-v$version → 镜像版本 $version）构建**各自仓库根的 Dockerfile**：
# 两边的根 Dockerfile 正是各自服务的构建文件，天然正确、不需要任何自定义规则
# （这正是 webmail 从主仓库拆分独立出去的原因）。
#
# 正常流程：
#   1. main 推送 → 本工作流打两个标签：
#        · 主仓库        release-v<日期>-<主仓库短SHA>    （web 版本）
#        · 邮件后端仓库  release-v<日期>-<邮件仓库短SHA>  （webmail 版本，
#          经 deploy key 跨仓库推送；两个仓库历史独立、版本号各自反映自身代码）
#   2. ACR 两侧各自检测标签 → 构建并产出同名版本号镜像；
#   3. 本工作流轮询两个版本号镜像就绪，并校验入口 Cmd（防构建规则误配时
#      静默部署错内容——历史上曾发生「webmail 镜像里装成 web 应用」，
#      校验失败直接终止部署）；
#   4. VPS 按版本号拉取镜像重建容器（境内直连、秒级）。
#
# 回滚：workflow_dispatch —— version 填 web 旧版本号、webmail_version 填邮件
#   旧版本号（两个镜像的全部版本都留在 ACR，各自永不覆写）。只填 version 时
#   仅回滚 web、webmail 保持现状。
#
# 为什么不在 GHA 构建：GHA runner 在海外，推 ACR 跨境上行实测 <60KB/s
#   （84.7 MB 的 web 镜像 30+ 分钟推不完）→ 此路不通。ACR 侧构建时跨境流量
#   只剩源码（~11 MB）。
#
# 依赖：仓库 Variables  REGISTRY（ACR 公网地址）/ IMAGE_NAMESPACE（命名空间）
#      仓库 Secrets    REGISTRY_USERNAME / REGISTRY_PASSWORD（私有镜像仓库）
#                      WEBMAIL_REPO_DEPLOY_KEY（邮件后端仓库 deploy key，
#                      写权限——跨仓库推标签；deploy key 推送是普通 push 事件，
#                      正常送达 ACR）
#                      VPS_HOST / VPS_USER / VPS_SSH_KEY
#      Secret（可选）  AUTOMERGE_TOKEN（PAT）：推主仓库标签时优先使用
#                      （GITHUB_TOKEN 推送的事件是否送达 ACR 未实测；PAT 一定送达）
# ============================================================================

jobs:
  build-and-deploy:
    name: Trigger ACR Build & Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 推 release-v* 标签以触发 ACR 构建
    env:
      # 可选 PAT：优先用于推主仓库标签。未配置时为空串（回退 GITHUB_TOKEN）。
      PUSH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image registry & version
        # 正常模式：web 版本 = <日期>-<主仓库短SHA>（webmail 版本在打标签步骤
        # 由邮件仓库 HEAD 确定）。回滚模式（填了 version 输入）：跳过构建，
        # 直接部署指定版本。
        env:
          IN_REGISTRY: ${{ vars.REGISTRY }}
          IN_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
          IN_VERSION: ${{ github.event.inputs.version }}
          IN_WEBMAIL_VERSION: ${{ github.event.inputs.webmail_version }}
        run: |
          REGISTRY="${IN_REGISTRY:?未配置仓库 Variable REGISTRY（ACR 公网地址）}"
          NAMESPACE="${IN_NAMESPACE:?未配置仓库 Variable IMAGE_NAMESPACE（ACR 命名空间）}"
          REPO="${{ github.event.repository.name }}"        # ysy-homepage-web
          WEBMAIL_REPO="ysy-homepage-webmail"
          {
            echo "REGISTRY=$REGISTRY"
            echo "NAMESPACE=$NAMESPACE"
            echo "REPO=$REPO"
            echo "WEBMAIL_REPO=$WEBMAIL_REPO"
          } >> "$GITHUB_ENV"
          if [ -n "$IN_VERSION" ]; then
            echo "回滚模式：web=$IN_VERSION；webmail=${IN_WEBMAIL_VERSION:-（保持现状，不动）}"
            {
              echo "VERSION=$IN_VERSION"
              echo "IMAGE=$REGISTRY/$NAMESPACE/$REPO:$IN_VERSION"
              echo "SKIP_BUILD=1"
            } >> "$GITHUB_ENV"
            if [ -n "$IN_WEBMAIL_VERSION" ]; then
              echo "WEBMAIL_IMAGE=$REGISTRY/$NAMESPACE/$WEBMAIL_REPO:$IN_WEBMAIL_VERSION" >> "$GITHUB_ENV"
            fi
          else
            VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA:0:7}"
            echo "本次 web 版本：$VERSION（将由 ACR 构建；webmail 版本在打标签步骤确定）"
            {
              echo "VERSION=$VERSION"
              echo "RELEASE_TAG=release-v$VERSION"
              echo "IMAGE=$REGISTRY/$NAMESPACE/$REPO:$VERSION"
            } >> "$GITHUB_ENV"
          fi

      - name: Login to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Create release tags (triggers ACR builds)
        if: env.SKIP_BUILD != '1'
        env:
          WM_DEPLOY_KEY: ${{ secrets.WEBMAIL_REPO_DEPLOY_KEY }}
        run: |
          set -e
          # ---- 主仓库（web）：PAT 优先（保证 ACR 的 GitHub App 收到事件），
          #      GITHUB_TOKEN 回退。标签已存在则删除重推：只有新的标签 push
          #      事件才会重新触发 ACR 构建。----
          if [ -n "$PUSH_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          if git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | grep -q .; then
            echo "标签 $RELEASE_TAG 已存在，删除后重推以重新触发构建"
            git push origin ":refs/tags/$RELEASE_TAG" || true
          fi
          git tag -f "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          echo "web 标签已推送：$RELEASE_TAG"

          # ---- 邮件后端仓库（webmail）：deploy key 跨仓库推标签。版本号取
          #      邮件仓库自身 HEAD 的短 SHA（两仓库历史独立）。----
          if [ -z "$WM_DEPLOY_KEY" ]; then
            echo "!!! 未配置 WEBMAIL_REPO_DEPLOY_KEY（邮件仓库 deploy key），无法推 webmail 标签"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$WM_DEPLOY_KEY" > ~/.ssh/wm_deploy_key
          chmod 600 ~/.ssh/wm_deploy_key
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/wm_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          WM_URL="git@github.com:${{ github.repository_owner }}/$WEBMAIL_REPO.git"
          rm -rf /tmp/wm-repo
          git clone --depth 1 "$WM_URL" /tmp/wm-repo
          cd /tmp/wm-repo
          WM_SHA="$(git rev-parse --short=7 HEAD)"
          WM_VERSION="$(date -u +%Y.%m.%d)-$WM_SHA"
          WM_TAG="release-v$WM_VERSION"
          if git ls-remote --tags origin "refs/tags/$WM_TAG" | grep -q .; then
            echo "标签 $WM_TAG 已存在，删除后重推"
            git push origin ":refs/tags/$WM_TAG" || true
          fi
          git tag -f "$WM_TAG"
          git push origin "$WM_TAG"
          echo "webmail 标签已推送：$WM_TAG（邮件仓库 $WM_SHA）"
          cd - >/dev/null
          {
            echo "WEBMAIL_VERSION=$WM_VERSION"
            echo "WEBMAIL_IMAGE=$REGISTRY/$NAMESPACE/$WEBMAIL_REPO:$WM_VERSION"
          } >> "$GITHUB_ENV"

      - name: Wait for ACR builds
        if: env.SKIP_BUILD != '1'
        run: |
          # 两个版本号镜像都出现才算就绪。出现后校验入口 Cmd：web 的入口应含
          # server.js、webmail 应含 tsx——防构建规则误配时静默部署错内容
          # （历史上 ACR 规则曾误用根 Dockerfile，把 web 应用装进了 webmail
          # 镜像；该缺陷全链路无报错，只有查镜像 config 才能拦住）。
          # ⚠ buildx 的 json 模板输出是**缩进** JSON——必须先 tr 压平再匹配；
          #    拿不到 config 时按就绪处理（保守）并打警告。
          deadline=$((SECONDS + 2400))   # 40 分钟（ACR 单次构建上限 30 分钟）
          while true; do
            web_ok=0; webmail_ok=0
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              cfg="$(docker buildx imagetools inspect --format '{{json .Image}}' "$IMAGE" 2>/dev/null | tr -d '[:space:]' || true)"
              if [ -z "$cfg" ]; then
                echo "（警告：web 镜像 config 校验不可用，跳过内容检查）"
                web_ok=1
              elif printf '%s' "$cfg" | grep -qF 'server.js'; then
                web_ok=1
              else
                echo "!!! web 镜像入口异常（config 中未见 server.js）——终止部署"
                printf '%s' "$cfg" | grep -o '"Cmd":\[[^]]*\]' | head -1 || true
                exit 1
              fi
            fi
            if docker manifest inspect "$WEBMAIL_IMAGE" >/dev/null 2>&1; then
              cfg="$(docker buildx imagetools inspect --format '{{json .Image}}' "$WEBMAIL_IMAGE" 2>/dev/null | tr -d '[:space:]' || true)"
              if [ -z "$cfg" ]; then
                echo "（警告：webmail 镜像 config 校验不可用，跳过内容检查）"
                webmail_ok=1
              elif printf '%s' "$cfg" | grep -qF 'tsx'; then
                webmail_ok=1
              else
                echo "!!! webmail 镜像入口异常（config 中未见 tsx，疑似构建了 web 应用）——终止部署"
                printf '%s' "$cfg" | grep -o '"Cmd":\[[^]]*\]' | head -1 || true
                exit 1
              fi
            fi
            if [ "$web_ok" = 1 ] && [ "$webmail_ok" = 1 ]; then
              echo "两个镜像均已就绪：web=$VERSION webmail=$WEBMAIL_VERSION"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "!!! 等待超时（40 分钟）：web=$web_ok webmail=$webmail_ok"
              echo "!!! 到 ACR 控制台对应镜像仓库的「构建日志」页排查："
              echo "!!!   $REGISTRY/$NAMESPACE/$REPO 与 $REGISTRY/$NAMESPACE/$WEBMAIL_REPO"
              echo "!!! 若日志显示构建成功：用 workflow_dispatch 把 version / webmail_version"
              echo "!!! 填成 ${VERSION} / ${WEBMAIL_VERSION} 重跑，会跳过等待直接部署。"
              exit 1
            fi
            sleep 20
          done

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          # ACR 为私有仓库，VPS 侧需登录；override 把本次部署的镜像按版本号钉死。
          # 回滚 = workflow_dispatch 把 version（与 webmail_version）填成旧版本号
          # 重跑（拉取+重建+生产冒烟完整走一遍）。
          script: |
            set -e
            cd ~/personal-homepage

            REGISTRY="${{ env.REGISTRY }}"
            NAMESPACE="${{ env.NAMESPACE }}"
            REPO="${{ env.REPO }}"
            WEBMAIL_REPO="${{ env.WEBMAIL_REPO }}"
            VERSION="${{ env.VERSION }}"
            WEB_IMAGE="${{ env.IMAGE }}"
            WEBMAIL_IMAGE="${{ env.WEBMAIL_IMAGE }}"

            if [ -n "${{ secrets.REGISTRY_PASSWORD }}" ]; then
              echo "${{ secrets.REGISTRY_PASSWORD }}" \
                | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
            fi

            # 前置校验：override 文件只提供 image:。若 VPS 上那份 docker-compose.yml
            # 缺服务定义，compose 会「凭一个 image 造出没有网络/挂载/环境变量的空壳
            # 服务」而不是报错——宁可在这里大声失败。
            for svc in web webmail; do
              if ! docker compose -f docker-compose.yml config --services | grep -qx "$svc"; then
                echo "!!! VPS 上的 docker-compose.yml 缺少服务 $svc，请先同步仓库里的该文件"
                exit 1
              fi
            done

            # 用 override 文件显式钉住本次部署的镜像，而不是依赖 VPS 上那份
            # docker-compose.yml 的 image: 行——VPS 的仓库副本可能滞后于 main。
            # webmail 只在指定了版本时更新（回滚只回 web 的场景保持现状）。
            cat > /tmp/registry-override.yml <<EOF
            services:
              web:
                image: $WEB_IMAGE
            EOF
            SERVICES="web"
            IMAGES="$WEB_IMAGE"
            if [ -n "$WEBMAIL_IMAGE" ]; then
              cat >> /tmp/registry-override.yml <<EOF
              webmail:
                image: $WEBMAIL_IMAGE
            EOF
              SERVICES="web webmail"
              IMAGES="$WEB_IMAGE $WEBMAIL_IMAGE"
            fi

            for img in $IMAGES; do
              for i in 1 2 3; do
                echo "=== 拉取 $img（第 $i 次）==="
                if timeout 600 docker pull "$img"; then
                  break
                fi
                if [ "$i" -lt 3 ]; then
                  echo "!!! 拉取失败，10 秒后重试"
                  sleep 10
                else
                  echo "!!! 三次拉取均失败，终止部署"
                  exit 1
                fi
              done
            done
            docker compose -f docker-compose.yml -f /tmp/registry-override.yml up -d --no-deps $SERVICES

            # 版本清理：每个镜像仓库只保留最近 5 个「版本号格式」tag
            # （YYYY.MM.DD-*，倒序即新旧序；正在使用的镜像 docker rmi 会拒绝删除）。
            # ACR 构建缓存镜像（__ACR_BUILD_SERVICE_INTERNAL_IMAGE_CACHE）与
            # probe 类标签不匹配该格式，不会误删。
            for r in "$REPO" "$WEBMAIL_REPO"; do
              docker images "$REGISTRY/$NAMESPACE/$r" --format '{{.Tag}}' | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-' \
                | sort -r | tail -n +6 | while read -r t; do
                    echo "清理旧版本：$r:$t"
                    docker rmi "$REGISTRY/$NAMESPACE/$r:$t" || true
                  done || true
            done
            docker image prune -f

  smoke-test:
    name: Smoke Test (Production)
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test production
        # 对线上站点跑同一套冒烟用例（页面 200 / 301 跳转 / OG 图 / 资源）
        # ⚠ --retries=1：跨海链路（runner 在海外、站点在国内 VPS）偶发超时，
        #   1 次重试滤掉瞬时时序抖动；确定性缺陷重试后仍会失败，不会掩盖真问题。
        # --reporter=list,html：配合下面的工件上传，失败时可直接下载报告与 trace。
        env:
          E2E_BASE_URL: https://shaoyuanyu.cn
        run: pnpm exec playwright test --retries=1 --reporter=list,html

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-production
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
