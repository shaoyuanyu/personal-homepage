# 个人网站 VPS 部署编排：站点 + Umami 统计
# 反向代理使用宿主机 Nginx（多域名分流），容器端口仅绑定回环地址 127.0.0.1
# 用法：docker compose up -d --build

services:
  web:
    # 镜像标签与 GitHub Actions 推送的 GHCR 标签一致：
    # 自动部署 = docker pull 该标签；手动部署 = docker load 同标签镜像
    image: ghcr.io/shaoyuanyu/personal-homepage:latest
    build:
      context: .
      args:
        # 站点 URL 构建期内联：部署初期证书未就绪用 http，就绪后改为 https://shaoyuanyu.cn
        SITE_URL: ${SITE_URL:-https://shaoyuanyu.cn}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # 仅本机回环：Nginx proxy_pass http://127.0.0.1:3000
    environment:
      - NODE_ENV=production
      # 主人登录（TOTP）密钥：由 pnpm totp:setup 生成，从 .env 读取
      - TOTP_SECRET=${TOTP_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
      - RECOVERY_CODES=${RECOVERY_CODES}
      # CalDAV（站主专属日历）写入凭证：compose 网络内访问 radicale 服务
      - CALDAV_URL=http://radicale:5232
      - CALDAV_USER=${CALDAV_USER}
      - CALDAV_PASSWORD=${CALDAV_PASSWORD}
      # 站内邮件（webmaild）代理目标：compose 网络内服务名。
      # ⚠ mail-agent 尚未部署：MAIL_AGENT_URL 保持缺省（127.0.0.1 不可达），前端
      #   按设计显示「agent 邮件后台不可达」；第二台 VPS 上线后在 .env 补值。
      - WEBMAIL_URL=http://webmail:9710
    volumes:
      # 主人私有数据（想法速记等），挂载宿主机目录便于直接查看/备份
      - ./data:/app/data
    networks:
      - web

  webmail:
    # 站内邮箱后端（webmaild）：IMAP 同步 + 收发 / 通讯录 / 账号管理的 HTTP API。
    # 与 web 同网络、不发布任何宿主端口——只有 compose 网络内的 web 容器可达
    # （后端自身无认证，信任边界 = 网络隔离 + 站点代理层的 isOwner 守卫）。
    image: ghcr.io/shaoyuanyu/webmail:latest
    build:
      context: .
      dockerfile: docker/webmail.Dockerfile
    restart: unless-stopped
    # 运行身份 = 宿主站点属主（VPS 上 ysy=1002；本地缺省 1000）——数据文件归 ysy，
    # 可直接备份/排查。⚠ 勿用镜像内建的 1001：这台 VPS 的 1001 是另一账号
    user: "${WEBMAIL_UID:-1000}:${WEBMAIL_GID:-1000}"
    environment:
      - WEBMAIL_DATA_DIR=/data
      # 容器内监听全部地址（端口不发布到宿主，仅在 compose 网络内可达）
      - WEBMAIL_HOST=0.0.0.0
    volumes:
      # 私有数据：accounts.json / credentials.json（600）/ webmail.db / eml/
      # ⚠ 首次部署：宿主机 mkdir webmail-data 后 chown 到同一 uid（见 user:，VPS 为 1002）
      - ./webmail-data:/data
    networks:
      - web

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000" # Nginx 分流 status.shaoyuanyu.cn 时使用；不需要可删除本服务与 db
    environment:
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=postgresql://umami:${POSTGRES_PASSWORD}@db:5432/umami
      # 密钥从 .env 读取（.env.example 是模板，勿提交真实密钥）
      - APP_SECRET=${UMAMI_APP_SECRET}
      # 禁止公开注册（此前曾遭公网扫描器抢注 admin；账号改为数据库直插创建）
      - DISABLE_REGISTRATION=true
    depends_on:
      - db
    networks:
      - web

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=umami
    volumes:
      - umami-db:/var/lib/postgresql/data
    networks:
      - web

  radicale:
    # 站主专属 CalDAV 会议日历（仅回环 + htpasswd 强密码认证，Nginx 反代子域名）
    image: kozea/radicale:latest
    restart: unless-stopped
    command: ["--config", "/data/config"]
    # 镜像默认以 radicale(uid 1000) 运行，而挂载目录属主是宿主机用户——
    # 显式指定为宿主 uid 使容器直接读写 radicale/ 下文件（600 的 users 也能读），无需 chown
    user: "${CALDAV_UID:-1000}:${CALDAV_GID:-1000}"
    ports:
      - "127.0.0.1:5232:5232" # 仅本机回环：Nginx 反代 calendar.shaoyuanyu.cn
    volumes:
      # 配置 + 用户文件 + 日历集合（私有勿入库；VPS 上运行 scripts/setup-calendar-vps.sh 初始化）
      - ./radicale:/data
    networks:
      - web

volumes:
  umami-db:

networks:
  web:
