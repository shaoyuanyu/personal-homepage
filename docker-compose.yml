# 个人网站 VPS 部署编排：站点 + Umami 统计 + Caddy 反向代理
# 用法：docker compose up -d --build
# 部署前请修改 Caddyfile 中的域名

services:
  web:
    build:
      context: .
      args:
        # 站点 URL 构建期内联：部署初期证书未就绪用 http，就绪后改为 https://shaoyuanyu.cn
        SITE_URL: ${SITE_URL:-https://shaoyuanyu.cn}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    networks:
      - web

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=postgresql://umami:${POSTGRES_PASSWORD}@db:5432/umami
      # 密钥从 .env 读取（.env.example 是模板，勿提交真实密钥）
      - APP_SECRET=${UMAMI_APP_SECRET}
    depends_on:
      - db
    networks:
      - web

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=umami
    volumes:
      - umami-db:/var/lib/postgresql/data
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - web

volumes:
  umami-db:
  caddy-data:
  caddy-config:

networks:
  web:
