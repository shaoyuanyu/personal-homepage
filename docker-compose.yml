# 个人网站 VPS 部署编排：站点 + Umami 统计
# 反向代理使用宿主机 Nginx（多域名分流），容器端口仅绑定回环地址 127.0.0.1
# 用法：docker compose up -d --build

services:
  web:
    # 镜像标签与 GitHub Actions 推送的 GHCR 标签一致：
    # 自动部署 = docker pull 该标签；手动部署 = docker load 同标签镜像
    image: ghcr.io/shaoyuanyu/personal-homepage:latest
    build:
      context: .
      args:
        # 站点 URL 构建期内联：部署初期证书未就绪用 http，就绪后改为 https://shaoyuanyu.cn
        SITE_URL: ${SITE_URL:-https://shaoyuanyu.cn}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # 仅本机回环：Nginx proxy_pass http://127.0.0.1:3000
    environment:
      - NODE_ENV=production
      # 主人登录（TOTP）密钥：由 pnpm totp:setup 生成，从 .env 读取
      - TOTP_SECRET=${TOTP_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
      - RECOVERY_CODES=${RECOVERY_CODES}
      # CalDAV（站主专属日历）写入凭证：compose 网络内访问 radicale 服务
      - CALDAV_URL=http://radicale:5232
      - CALDAV_USER=${CALDAV_USER}
      - CALDAV_PASSWORD=${CALDAV_PASSWORD}
    volumes:
      # 主人私有数据（想法速记等），挂载宿主机目录便于直接查看/备份
      - ./data:/app/data
    networks:
      - web

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000" # Nginx 分流 status.shaoyuanyu.cn 时使用；不需要可删除本服务与 db
    environment:
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=postgresql://umami:${POSTGRES_PASSWORD}@db:5432/umami
      # 密钥从 .env 读取（.env.example 是模板，勿提交真实密钥）
      - APP_SECRET=${UMAMI_APP_SECRET}
      # 禁止公开注册（此前曾遭公网扫描器抢注 admin；账号改为数据库直插创建）
      - DISABLE_REGISTRATION=true
    depends_on:
      - db
    networks:
      - web

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=umami
    volumes:
      - umami-db:/var/lib/postgresql/data
    networks:
      - web

  radicale:
    # 站主专属 CalDAV 会议日历（仅回环 + htpasswd 强密码认证，Nginx 反代子域名）
    image: kozea/radicale:latest
    restart: unless-stopped
    command: ["--config", "/data/config"]
    # 镜像默认以 radicale(uid 1000) 运行，而挂载目录属主是宿主机用户——
    # 显式指定为宿主 uid 使容器直接读写 radicale/ 下文件（600 的 users 也能读），无需 chown
    user: "${CALDAV_UID:-1000}:${CALDAV_GID:-1000}"
    ports:
      - "127.0.0.1:5232:5232" # 仅本机回环：Nginx 反代 calendar.shaoyuanyu.cn
    volumes:
      # 配置 + 用户文件 + 日历集合（私有勿入库；VPS 上运行 scripts/setup-calendar-vps.sh 初始化）
      - ./radicale:/data
    networks:
      - web

volumes:
  umami-db:

networks:
  web:
