# 个人网站 VPS 部署编排：站点 + Umami 统计
# 反向代理使用宿主机 Nginx（多域名分流），容器端口仅绑定回环地址 127.0.0.1
# 用法：docker compose up -d --build

services:
  web:
    build:
      context: .
      args:
        # 站点 URL 构建期内联：部署初期证书未就绪用 http，就绪后改为 https://shaoyuanyu.cn
        SITE_URL: ${SITE_URL:-https://shaoyuanyu.cn}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # 仅本机回环：Nginx proxy_pass http://127.0.0.1:3000
    environment:
      - NODE_ENV=production
    networks:
      - web

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000" # Nginx 分流 status.shaoyuanyu.cn 时使用；不需要可删除本服务与 db
    environment:
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=postgresql://umami:${POSTGRES_PASSWORD}@db:5432/umami
      # 密钥从 .env 读取（.env.example 是模板，勿提交真实密钥）
      - APP_SECRET=${UMAMI_APP_SECRET}
    depends_on:
      - db
    networks:
      - web

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=umami
    volumes:
      - umami-db:/var/lib/postgresql/data
    networks:
      - web

volumes:
  umami-db:

networks:
  web:
